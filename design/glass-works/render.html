<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>刘禹博 · GitHub 主页素材</title>
<style>
*{box-sizing:border-box}html,body{margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#24272a;background:#fff;-webkit-font-smoothing:antialiased}
:root{--canvas:#fff;--ink:#24272a;--muted:#676c71;--line:rgba(40,45,52,.09);--glass:rgba(255,255,255,.78);--edge:rgba(255,255,255,.96);--shadow:0 10px 24px rgba(25,30,40,.055),0 2px 5px rgba(25,30,40,.035)}
body.dark{--canvas:#0d1117;--ink:#edf0f4;--muted:#a4acb6;--line:rgba(230,238,255,.12);--glass:rgba(35,41,49,.84);--edge:rgba(230,238,255,.12);--shadow:0 12px 28px rgba(0,0,0,.2),0 2px 5px rgba(0,0,0,.1);background:var(--canvas);color:var(--ink)}
.artboard{width:840px;height:348px;position:relative;overflow:hidden;background:var(--canvas)}
.card{position:absolute;inset:33px 12px 18px;display:grid;grid-template-columns:40% 60%;border:1px solid var(--edge);border-radius:22px;box-shadow:var(--shadow);background:var(--glass);backdrop-filter:blur(12px);overflow:hidden}
.copy{padding:30px 12px 26px 28px;display:flex;flex-direction:column;position:relative;z-index:2}
.eyebrow{font-size:11px;line-height:1.6;letter-spacing:2.2px;color:var(--muted);font-weight:400;margin:0}
.category{font-size:12px;line-height:1.6;color:var(--muted);margin:0 0 13px;letter-spacing:.25px;display:flex;align-items:center;gap:10px}
.category span{font-size:10px;letter-spacing:1.6px;border-right:1px solid var(--line);padding-right:10px}
h1,h2,p{margin:0}h2{font-size:30px;letter-spacing:-.9px;font-weight:500;line-height:1.3}
.summary{font-size:16px;line-height:1.85;letter-spacing:.1px;color:var(--muted);margin-top:15px;max-width:258px;text-wrap:pretty}
.action{margin-top:auto;padding-top:17px;font-size:12px;line-height:1.3;color:var(--ink);display:flex;gap:18px;align-items:center}
.action .arrow{font-size:19px;font-weight:300}
.visual{position:relative;align-self:stretch;min-width:0}
.screen{position:absolute;top:45px;left:13px;width:454px;padding:5px;background:rgba(255,255,255,.86);border:1px solid rgba(40,45,55,.11);border-radius:12px;box-shadow:0 10px 28px rgba(20,25,35,.08),0 1px 3px rgba(20,25,35,.05);transform:rotate(-3deg)}
.screen img{display:block;width:100%;height:auto;border-radius:7px}
.dark .screen{background:#303741;border-color:#47505d;box-shadow:0 12px 28px #0004}
.caption{display:none}
.card{border-color:var(--line)}
.heading{height:104px;padding:17px 14px 10px;display:flex;align-items:center;justify-content:space-between}
.heading h1{font-size:31px;line-height:1.3;font-weight:500;letter-spacing:-.8px;margin-top:9px}
.heading .aside{font-size:12px;color:var(--muted);align-self:flex-end;padding-bottom:10px;letter-spacing:.3px}
body.mobile .artboard{width:368px}
body.mobile .project{height:466px}
body.mobile .card{inset:25px 5px 15px;display:flex;flex-direction:column;border-radius:20px}
body.mobile .copy{padding:22px 22px 0;display:block}
body.mobile .category{margin-bottom:9px;font-size:11px}
body.mobile h2{font-size:28px}
body.mobile .summary{margin-top:12px;font-size:14px;line-height:1.85;max-width:none}
body.mobile .action{margin-top:0;padding-top:12px;font-size:12px;gap:14px}
body.mobile .visual{flex:1;min-height:0;margin-top:1px}
body.mobile .screen{width:314px;top:27px;left:21px;padding:4px;border-radius:10px;transform:rotate(-2deg)}
body.mobile .caption{display:none}
body.mobile .heading{height:96px;padding:9px 7px 12px}
body.mobile .heading h1{font-size:27px;margin-top:8px}
body.mobile .heading .aside{display:none}
.hero{height:360px}
.hero-shell{position:absolute;inset:10px 12px 20px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(115deg,var(--canvas) 5%,#f6f7f8 100%);box-shadow:none;overflow:hidden}
.hero-pattern{position:absolute;inset:0;background:url(https://liuyvbo2026.github.io/assets/ai-product-grey-pixels.png) 90% 40%/1000px auto no-repeat;opacity:.2;mask-image:linear-gradient(100deg,transparent 18%,#000 90%)}
.hero-content{position:relative;padding:27px 30px}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.hero-brand{font-size:13px;letter-spacing:2.1px;font-weight:600}
.hero-tagline{font-size:11px;letter-spacing:.7px;color:var(--muted)}
.hero-intro{font-size:16px;line-height:1.6;color:var(--muted);margin-top:36px}
.hero-intro strong{font-weight:600;color:var(--ink)}
.hero-title{font-size:49px;font-weight:400;letter-spacing:-1.6px;line-height:1.3;margin-top:18px;white-space:nowrap;display:flex;gap:14px}
.hero-title span:first-child{color:#53575c}
.hero-button{display:inline-flex;align-items:center;gap:24px;margin-top:30px;padding:13px 20px;background:#252a30;color:#fff;border:1px solid #252a30;border-radius:28px;font-size:12px;line-height:1.2;box-shadow:0 5px 10px #20242a16}
.hero-button b{font-size:19px;line-height:1;font-weight:400}
.dark .hero-shell{background:linear-gradient(115deg,#141a22 5%,#202833 100%)}
.dark .hero-pattern{filter:invert(1);mix-blend-mode:screen;opacity:.15}
.dark .hero-title span:first-child{color:#b1b9c4}
.dark .hero-button{background:#edf0f4;color:#20252c;border-color:#fff8;box-shadow:0 5px 14px #0003}
body.mobile .hero{height:382px}
body.mobile .hero-shell{inset:6px 5px 18px;border-radius:20px}
body.mobile .hero-content{padding:25px 22px}
body.mobile .hero-brand{font-size:11px;letter-spacing:1.7px}
body.mobile .hero-tagline{font-size:9px;letter-spacing:0}
body.mobile .hero-intro{font-size:14px;margin-top:39px}
body.mobile .hero-title{font-size:37px;letter-spacing:-1px;line-height:1.4;margin-top:18px;display:block}
body.mobile .hero-title span{display:block}
body.mobile .hero-button{margin-top:26px;padding:12px 18px;font-size:12px}
body.mobile .hero-pattern{background-size:740px;background-position:63% 45%;opacity:.18;mask-image:linear-gradient(100deg,transparent 10%,#000)}
.artboard.project{width:420px;height:440px}
.project .card{inset:8px 8px 12px;display:flex;flex-direction:column;padding:22px;background:linear-gradient(145deg,var(--canvas),#fafbfc);border:1px solid var(--line);border-radius:20px;box-shadow:none;backdrop-filter:none}
.project .visual{height:216px;flex:none;margin:0}
.project .screen{position:static;width:100%;height:216px;padding:0;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:none;transform:none;overflow:hidden}
.project .screen img{display:block;width:100%;height:100%;object-fit:contain;border-radius:0}
.project .copy{padding:20px 0 0;display:block}
.project .category{font-size:10px;margin-bottom:8px;line-height:1.5}
.project .category span{font-size:9px}
.project .title-row{display:flex;justify-content:space-between;align-items:center}
.project h2{font-size:26px;line-height:1.3;font-weight:500;letter-spacing:-.6px}
.project .title-arrow{font-size:22px;font-weight:300;padding-left:10px}
.project .summary{font-size:15px;line-height:1.75;margin-top:11px;max-width:none}
.dark .project .card{background:linear-gradient(145deg,#1a2029,#202731)}
.dark .project .screen{border-color:#424a56}
.repository-visual{height:216px;border:1px solid var(--line);border-radius:11px;background:linear-gradient(145deg,var(--canvas),#eef0f3);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:9px}
.repository-visual .code-mark{font-size:72px;line-height:1;font-weight:300;letter-spacing:-6px;color:#60666e;font-family:ui-monospace,monospace}
.repository-visual .code-caption{font-size:10px;letter-spacing:3px;color:var(--muted)}
.dark .repository-visual{background:linear-gradient(145deg,#202731,#2a3441)}
.dark .repository-visual .code-mark{color:#b8c1ce}
body.mobile .artboard.project{width:368px;height:440px}
body.mobile .project .card{inset:6px 5px 12px;padding:20px;border-radius:18px}
body.mobile .project .visual,body.mobile .project .screen,body.mobile .repository-visual{height:202px}
body.mobile .project .screen{position:static;width:100%;padding:0;transform:none;border-radius:10px}
body.mobile .project .copy{padding:20px 0 0}
body.mobile .project h2{font-size:27px}
body.mobile .project .category{font-size:11px}
body.mobile .project .summary{font-size:16px;line-height:1.75}
.project .visual{height:232px;isolation:isolate}
.project .screen{position:absolute;top:14px;left:4px;width:calc(100% - 20px);height:auto;padding:4px;border-radius:11px;transform:rotate(-3deg);box-shadow:0 6px 16px rgba(25,35,45,.075)}
.project .screen img{height:auto;border-radius:7px}
.screenshot-back{position:absolute;top:0;left:32px;width:calc(100% - 45px);padding:4px;border:1px solid var(--line);border-radius:11px;background:#fafbfc;transform:rotate(4deg);box-shadow:0 2px 8px rgba(25,35,45,.04)}
.screenshot-back img{display:block;width:100%;border-radius:7px;opacity:.7}
.dark .screenshot-back,.dark .project .screen{background:#303741;border-color:#46505d}
.repository-visual{height:232px}
body.mobile .project .visual,body.mobile .repository-visual{height:210px}
body.mobile .project .screen{position:absolute;top:12px;left:2px;width:calc(100% - 14px);height:auto;padding:4px;transform:rotate(-3deg)}
body.mobile .screenshot-back{left:29px;width:calc(100% - 34px)}
</style>
</head>
<body>
<main id="artboard"></main>
<script>
const projects={
shangtu:{number:'01',name:'商图AI',category:'电商工具 / AI 商品图',summary:'从商品原图出发，生成白底图、卖点图和场景图。',image:'project-shangtu-ai.jpg',secondary:'project-shangtu-layout.jpg',caption:'商品套图工作台'},
docai:{number:'02',name:'DocAI',category:'AI 应用 / 文档问答',summary:'向资料提问、总结重点，顺着答案中的引用回到原文。',image:'project-docai-home-hd.png',secondary:'project-docai-answer-hd.png',caption:'文档问答与资料管理'},
zhiying:{number:'03',name:'知应',category:'企业工具 / AI 客服',summary:'把会话、知识库与人工接管放在一个工作台。',image:'project-zhiying.jpg',secondary:'project-zhiying-knowledge.jpg',caption:'工作流草稿编辑器'},
repositories:{number:'04',name:'全部仓库',category:'项目与源码',summary:'在 GitHub 上查看我的全部公开仓库。'}
};
const q=new URLSearchParams(location.search),kind=q.get('kind')||'shangtu';
document.body.classList.toggle('dark',q.get('theme')==='dark');document.body.classList.toggle('mobile',q.get('size')==='mobile');
const root=document.getElementById('artboard');
if(kind==='hero'){root.className='artboard hero';root.innerHTML='<div class="hero-shell"><div class="hero-pattern"></div><div class="hero-content"><div class="hero-top"><p class="hero-brand">LIU YUBO</p><p class="hero-tagline">产品、实践与思考</p></div><p class="hero-intro">我是<strong>刘禹博</strong>，一名 AI 产品经理。</p><h1 class="hero-title"><span>从一个想法</span><span>到一个产品。</span></h1><p class="hero-button">进入个人站 <b>↗</b></p></div></div>';}
else if(kind==='heading'){root.className='artboard heading';root.innerHTML='<div><h1>作品与实验</h1></div><p class="aside">把想法做成可以使用的产品。</p>';}
else{const p=projects[kind];root.className='artboard project';const visual=p.image?`<div class="visual"><div class="screenshot-back"><img src="https://liuyvbo2026.github.io/assets/${p.secondary}" alt=""></div><div class="screen"><img src="https://liuyvbo2026.github.io/assets/${p.image}" alt="${p.caption}"></div></div>`:'<div class="repository-visual"><span class="code-mark">&lt;/&gt;</span><span class="code-caption">GITHUB REPOSITORIES</span></div>';root.innerHTML=`<article class="card">${visual}<div class="copy"><p class="category"><span>${p.number}</span>${p.category}</p><div class="title-row"><h2>${p.name}</h2><span class="title-arrow">↗</span></div><p class="summary">${p.summary}</p></div></article>`;}
document.fonts.ready.then(async()=>{await Promise.all([...document.images].map(i=>i.decode()));window.renderReady=true;});
</script>
</body></html>

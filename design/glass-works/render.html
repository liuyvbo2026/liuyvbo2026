<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>作品与实验 · GitHub 主页素材</title>
<style>
*{box-sizing:border-box}html,body{margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#24272a;background:#fff;-webkit-font-smoothing:antialiased}
:root{--canvas:#fff;--ink:#24272a;--muted:#676c71;--line:rgba(40,45,52,.09);--glass:rgba(255,255,255,.78);--edge:rgba(255,255,255,.96);--shadow:0 10px 24px rgba(25,30,40,.055),0 2px 5px rgba(25,30,40,.035)}
body.dark{--canvas:#0d1117;--ink:#edf0f4;--muted:#a4acb6;--line:rgba(230,238,255,.12);--glass:rgba(35,41,49,.84);--edge:rgba(230,238,255,.12);--shadow:0 12px 28px rgba(0,0,0,.2),0 2px 5px rgba(0,0,0,.1);background:var(--canvas);color:var(--ink)}
.artboard{width:840px;height:348px;position:relative;overflow:hidden;background:var(--canvas)}
.wash{position:absolute;inset:8px;background:radial-gradient(ellipse at 76% 50%,#eef0f2 0,rgba(246,247,248,.6) 44%,transparent 75%);border-radius:28px}
.wash:after{content:"";position:absolute;inset:0;background:url(https://liuyvbo2026.github.io/assets/ai-product-grey-pixels.png) 100% 40%/620px auto no-repeat;opacity:.13;mask-image:radial-gradient(ellipse at 90% 50%,black,transparent 73%)}
.dark .wash{background:radial-gradient(ellipse at 76% 50%,#222b36,transparent 74%)}.dark .wash:after{filter:invert(1);mix-blend-mode:screen;opacity:.13}
.stack{position:absolute;top:14px;left:39px;right:39px;height:100px;border:1px solid var(--edge);border-radius:20px;background:var(--glass);box-shadow:0 1px 3px rgba(20,30,40,.03)}
.stack.second{top:23px;left:26px;right:26px}
.card{position:absolute;inset:33px 12px 18px;display:grid;grid-template-columns:40% 60%;border:1px solid var(--edge);border-radius:22px;box-shadow:var(--shadow);background:var(--glass);backdrop-filter:blur(12px);overflow:hidden}
.copy{padding:30px 12px 26px 28px;display:flex;flex-direction:column;position:relative;z-index:2}
.eyebrow{font-size:11px;line-height:1.6;letter-spacing:2.2px;color:var(--muted);font-weight:400;margin:0}
.category{font-size:12px;line-height:1.6;color:var(--muted);margin:0 0 13px;letter-spacing:.25px;display:flex;align-items:center;gap:10px}
.category span{font-size:10px;letter-spacing:1.6px;border-right:1px solid var(--line);padding-right:10px}
h1,h2,p{margin:0}h2{font-size:30px;letter-spacing:-.9px;font-weight:500;line-height:1.3}
.summary{font-size:16px;line-height:1.85;letter-spacing:.1px;color:var(--muted);margin-top:15px;max-width:258px;text-wrap:pretty}
.action{margin-top:auto;padding-top:17px;font-size:12px;line-height:1.3;color:var(--ink);display:flex;gap:18px;align-items:center}
.action .arrow{font-size:19px;font-weight:300}
.visual{position:relative;align-self:stretch;min-width:0}
.screen{position:absolute;top:45px;left:13px;width:454px;padding:5px;background:rgba(255,255,255,.86);border:1px solid rgba(40,45,55,.11);border-radius:12px;box-shadow:0 10px 28px rgba(20,25,35,.08),0 1px 3px rgba(20,25,35,.05);transform:rotate(-3deg)}
.screen img{display:block;width:100%;height:auto;border-radius:7px}
.peek{position:absolute;top:21px;left:61px;width:415px;height:226px;transform:rotate(4deg);padding:5px;background:#fafbfc;border:1px solid rgba(40,45,55,.1);border-radius:12px;box-shadow:0 4px 16px rgba(20,25,35,.045);overflow:hidden}
.peek img{width:100%;border-radius:7px;opacity:.65}
.dark .screen,.dark .peek{background:#303741;border-color:#47505d;box-shadow:0 12px 28px #0004}
.caption{display:none}
.stack{background:linear-gradient(100deg,var(--canvas),rgba(225,229,234,.4));border-color:var(--line)}
.dark .stack{background:linear-gradient(100deg,var(--canvas),#272e38)}
.card{border-color:var(--line)}
.heading{height:104px;padding:17px 14px 10px;display:flex;align-items:center;justify-content:space-between}
.heading h1{font-size:31px;line-height:1.3;font-weight:500;letter-spacing:-.8px;margin-top:9px}
.heading .aside{font-size:12px;color:var(--muted);align-self:flex-end;padding-bottom:10px;letter-spacing:.3px}
.footer{height:128px;padding:10px 12px 18px}
.footer-box{height:100%;border:1px solid var(--line);border-radius:20px;padding:23px 28px;background:linear-gradient(120deg,var(--canvas),var(--glass));display:flex;align-items:center;justify-content:space-between}
.footer h2{font-size:21px;letter-spacing:-.3px}.footer .sub{font-size:12px;color:var(--muted);margin-top:7px}.footer .go{font-size:13px;display:flex;align-items:center;gap:22px}.footer .go b{font-size:22px;font-weight:300}
body.mobile .artboard{width:368px}
body.mobile .project{height:466px}
body.mobile .wash{inset:5px 1px}
body.mobile .stack{top:9px;left:27px;right:27px;border-radius:18px}
body.mobile .stack.second{top:17px;left:17px;right:17px}
body.mobile .card{inset:25px 5px 15px;display:flex;flex-direction:column;border-radius:20px}
body.mobile .copy{padding:22px 22px 0;display:block}
body.mobile .category{margin-bottom:9px;font-size:11px}
body.mobile h2{font-size:28px}
body.mobile .summary{margin-top:12px;font-size:14px;line-height:1.85;max-width:none}
body.mobile .action{margin-top:0;padding-top:12px;font-size:12px;gap:14px}
body.mobile .visual{flex:1;min-height:0;margin-top:1px}
body.mobile .screen{width:314px;top:27px;left:21px;padding:4px;border-radius:10px;transform:rotate(-2deg)}
body.mobile .peek{width:291px;height:174px;top:12px;left:47px;transform:rotate(4deg);padding:4px;border-radius:10px}
body.mobile .caption{display:none}
body.mobile .heading{height:96px;padding:9px 7px 12px}
body.mobile .heading h1{font-size:27px;margin-top:8px}
body.mobile .heading .aside{display:none}
body.mobile .footer{height:137px;padding:6px 5px 15px}
body.mobile .footer-box{padding:21px 22px;align-items:flex-start;position:relative}
body.mobile .footer h2{font-size:20px}
body.mobile .footer .sub{font-size:12px;max-width:230px;line-height:1.7}
body.mobile .footer .go{font-size:0;position:absolute;right:24px;top:27px}
</style>
</head>
<body>
<main id="artboard"></main>
<script>
const projects={
shangtu:{number:'01',name:'商图AI',category:'电商工具 / AI 商品图',summary:'从商品原图出发，生成白底图、卖点图和场景图。',image:'project-shangtu-ai.jpg',peek:'project-shangtu-layout.jpg',caption:'商品套图工作台'},
docai:{number:'02',name:'DocAI',category:'AI 应用 / 文档问答',summary:'向资料提问、总结重点，顺着答案中的引用回到原文。',image:'project-docai-home-hd.png',peek:'project-docai-answer-hd.png',caption:'文档问答与资料管理'},
zhiying:{number:'03',name:'知应',category:'企业工具 / AI 客服',summary:'把会话、知识库与人工接管放在一个工作台。',image:'project-zhiying.jpg',peek:'project-zhiying-knowledge.jpg',caption:'工作流草稿编辑器'}
};
const q=new URLSearchParams(location.search),kind=q.get('kind')||'shangtu';
document.body.classList.toggle('dark',q.get('theme')==='dark');document.body.classList.toggle('mobile',q.get('size')==='mobile');
const root=document.getElementById('artboard');
if(kind==='heading'){root.className='artboard heading';root.innerHTML='<div><p class="eyebrow">01 / WORKS</p><h1>作品与实验</h1></div><p class="aside">把想法做成可以使用的产品。</p>';}
else if(kind==='repositories'){root.className='artboard footer';root.innerHTML='<div class="footer-box"><div><h2>还有一些尝试。</h2><p class="sub">更多项目与代码，留在 GitHub 里。</p></div><p class="go">查看全部仓库 <b>↗</b></p></div>';}
else{const p=projects[kind];root.className='artboard project';root.innerHTML=`<div class="wash"></div><div class="stack"></div><div class="stack second"></div><article class="card"><div class="copy"><p class="category"><span>${p.number}</span>${p.category}</p><h2>${p.name}</h2><p class="summary">${p.summary}</p><p class="action">查看项目<span class="arrow">↗</span></p></div><div class="visual"><div class="peek"><img src="https://liuyvbo2026.github.io/assets/${p.peek}" alt=""></div><div class="screen"><img src="https://liuyvbo2026.github.io/assets/${p.image}" alt="${p.caption}"></div><p class="caption">${p.caption}</p></div></article>`;}
document.fonts.ready.then(async()=>{await Promise.all([...document.images].map(i=>i.decode()));window.renderReady=true;});
</script>
</body></html>

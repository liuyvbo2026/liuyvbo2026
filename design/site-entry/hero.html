<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>刘禹博 · 个站入口预览</title>
<style>
*{box-sizing:border-box}html,body{margin:0}body{background:#fff;color:#272b30;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
.artboard{width:840px;height:198px;padding:8px 12px 12px;background:#fff}
.entry{height:100%;display:flex;align-items:center;justify-content:space-between;gap:34px;padding:27px 32px;border:1px solid #e4e6e8;border-radius:22px;background:linear-gradient(110deg,#fff 0%,#fff 55%,#f8f9fa 100%);text-decoration:none;color:inherit}
.copy{min-width:0}
.brand{font-size:10px;line-height:1.3;letter-spacing:2px;font-weight:600;margin:0;color:#6b727a}
h1{font-size:29px;font-weight:450;line-height:1.35;letter-spacing:-.6px;margin:13px 0 10px;display:flex;align-items:center;gap:12px}
.greeting-text{white-space:nowrap}
.smile{width:28px;height:28px;flex:none;overflow:visible;shape-rendering:crispEdges;color:#8b949d}
.dark .smile{color:#9aa6b4}
.description{font-size:13px;line-height:1.8;color:#727981;margin:0}
.destination{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;gap:12px;padding-left:26px;min-width:211px;border-left:1px solid #e9ebee;min-height:100px}
.button{display:inline-flex;align-items:center;justify-content:space-between;gap:23px;font-size:12px;line-height:1.3;padding:13px 19px;border:1px solid #292e34;border-radius:25px;background:#292e34;color:white}
.button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.url{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:9px;line-height:1.4;letter-spacing:.05px;color:#969da5}
body.dark,body.dark .artboard{background:#0d1117;color:#edf0f4}
.dark .entry{border-color:#30363d;background:linear-gradient(110deg,#161b22 0%,#161b22 55%,#1c232d 100%)}
.dark .brand{color:#a5aeb9}.dark .description{color:#a4acb6}
.dark .destination{border-color:#30363d}.dark .button{background:#edf0f4;color:#20252c;border-color:#edf0f4}.dark .url{color:#919ba8}
@media(max-width:500px){.artboard{width:368px;height:248px;padding:6px 5px 12px}.entry{padding:25px 23px;display:block;border-radius:20px}.brand{font-size:10px}h1{font-size:27px;margin-top:15px;gap:10px}.description{font-size:12px}.destination{min-height:0;min-width:0;border:0;padding:0;margin-top:20px;flex-direction:row;justify-content:space-between;gap:12px;align-items:center}.button{font-size:11px;gap:16px;padding:11px 15px}.url{font-size:7.5px;letter-spacing:-.2px}}
</style>
</head>
<body>
<main class="artboard">
  <a class="entry" href="https://liuyvbo2026.github.io/" aria-label="进入刘禹博的个人站，查看项目介绍、文章和个人信息">
    <div class="copy">
      <p class="brand">LIU YUBO</p>
      <h1><svg class="smile" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M5 0h6v1h2v1h1v1h1v2h1v6h-1v2h-1v1h-1v1h-2v1H5v-1H3v-1H2v-1H1v-2H0V5h1V3h1V2h1V1h2ZM5 1h6v1h2v1h1v2h1v6h-1v2h-1v1h-2v1H5v-1H3v-1H2v-2H1V5h1V3h1V2h2Z"/><path fill="currentColor" d="M5 5h1v2H5Zm5 0h1v2h-1ZM5 10h1v1H5Zm1 1h4v1H6Zm4-1h1v1h-1Z"/></svg><span class="greeting-text">你好，我是刘禹博。</span></h1>
      <p class="description">项目介绍、文章，以及更多关于我。</p>
    </div>
    <div class="destination">
      <span class="button">进入个人站 <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 15 15 5M5 5h10v10"/></svg></span>
      <p class="url">liuyvbo2026.github.io</p>
    </div>
  </a>
</main>
<script>document.body.classList.toggle('dark',new URLSearchParams(location.search).get('theme')==='dark');</script>
</body>
</html>
